# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
# （1.18.2 / 1.20.1 都是 Java 17；master 1.21.1 主线用 jdk-21）
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本 —— 与本地实例严格对齐
#  1.18.2 分支：Forge 1.18.2-40.3.12（用户 HMCL 测试实例同版本）
#  这一代不存在 NeoForge（NeoForge 首个版本是 1.20.1），平台就是 Forge 本体。
# ============================================================
minecraft_version=1.18.2
minecraft_version_range=[1.18.2]
# legacy 插件要求带 MC 前缀的完整版本号（net.minecraftforge:forge:1.18.2-40.3.12）
forge_version=1.18.2-40.3.12
# mods.toml 里对平台 mod 的依赖范围。
#   下界取 40.2（1.18.2 线的起点）而不是编译用的 40.3.12 ——
#   否则 40.2.x 的老整合包会被 FML 直接拒载，本可用却用不了。
forge_version_range=[40.2,)
# 1.18.2 世代 FML 语言加载器（javafml）大版本是 40
loader_version_range=[40,)

# ============================================================
#  模组元信息
# ============================================================
mod_id=logiscope
mod_name=LogiScope
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免各版本线的 jar 混装。
# 本分支 = 0.1.2-1.18.2-alpha：功能对齐 1.20.1 线的 0.1.2，alpha 表示实机尚未验收。
mod_version=0.1.2-1.18.2-alpha
mod_group_id=com.jessetech.logiscope
