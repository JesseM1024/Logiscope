# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
org.gradle.java.home=C:/Program Files/Java/jdk-21

# ============================================================
#  版本 —— 与本地实例严格对齐
#  目标实例：versions/1.21.1-NeoForge（NeoForge 21.1.209）
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[4,)

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
#  模组元信息
# ============================================================
mod_id=logiscope
mod_name=LogiScope
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免两个版本线的 jar 混装。
# master（1.21.1 主线）= 0.1.2-1.21.1；mc-1.20.1 分支 = 0.1.2-1.20.1-alpha。
mod_version=0.1.2-1.21.1
mod_group_id=com.jessetech.logiscope
