# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
# （1.20.1 = Java 17；master 1.21.1 主线用的是 jdk-21）
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本 —— 与本地实例严格对齐
#  1.20.1 分支：NeoForge 1.20.1-47.1.106（1.20.1 线最后一个版本）
#  测试实例：待定（现有两个实例都是 1.21.1），装好后回填到这里
# ============================================================
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# legacy 插件要求带 MC 前缀的完整版本号（net.neoforged:forge:1.20.1-47.1.106）
neo_version=1.20.1-47.1.106
# mods.toml 里对平台 mod（1.20.1 世代 modId 仍叫 "forge"）的依赖范围
neo_version_range=[47,)
# 1.20.1 世代 FML 语言加载器大版本是 47
loader_version_range=[47,)

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# ============================================================
#  模组元信息
# ============================================================
mod_id=logiscope
mod_name=LogiScope
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免两个版本线的 jar 混装。
# mc-1.20.1 分支 = 0.1.0-1.20.1；master（1.21.1 主线）= 0.1.0-1.21.1。
mod_version=0.1.0-1.20.1
mod_group_id=com.jessetech.logiscope
