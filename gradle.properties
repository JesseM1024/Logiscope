# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
# 官方 MDK 也是 false：1.12.2 的反编译流程很吃内存，守护进程留着容易 OOM。
org.gradle.daemon=false

# Gradle 4.9 的守护进程**必须**跑在 Java 8 上（Gradle 4.x 不支持 11+）。
# 编译目标同样是 1.8（build.gradle 里的 sourceCompatibility）。
org.gradle.java.home=C:/Program Files/Java/jdk-1.8

# ============================================================
#  版本 —— 与本地实例严格对齐
#  1.12.2 这一代只有 Forge 一家（没有 NeoForge），平台就是 Forge 本体。
#  Forge 14.23.5.2859 是 1.12.2 的最后一个版本，也是社区事实标准。
# ============================================================
minecraft_version=1.12.2
forge_version=1.12.2-14.23.5.2859
mc_version_range=[1.12.2]

# ============================================================
#  模组元信息
# ============================================================
mod_id=logiscope
mod_name=LogiScope
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免各版本线的 jar 混装。
# 本线从 0.1.0 起步：代码面还在移植中（见 docs/PORT-1.12.2.md），先不跟另外三条线的 0.1.3。
mod_version=0.1.0-1.12.2
mod_group_id=com.jessetech.logiscope
