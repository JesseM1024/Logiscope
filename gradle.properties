# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 守护进程用 JDK 17（Gradle 7.6 支持），编译目标由 build.gradle 的
# toolchain 锁到 Java 8 —— 1.16.5 是 Java 8 世代，代码必须是 8 的语法子集。
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本 —— 与本地实例严格对齐
#  1.16.5 分支：Forge 1.16.5-36.2.42（用户 HMCL 测试实例同版本）
#  这一代不存在 NeoForge（NeoForge 首个版本是 1.20.1），平台就是 Forge 本体。
# ============================================================
minecraft_version=1.16.5
minecraft_version_range=[1.16.5]
# ForgeGradle 5 要求带 MC 前缀的完整版本号（net.minecraftforge:forge:1.16.5-36.2.42）
forge_version=1.16.5-36.2.42
# mods.toml 里对平台 mod 的依赖范围。
#   下界取 36（1.16.5 线的起点），而不是编译用的 36.2.42 ——
#   否则 36.0.x / 36.1.x 的老整合包会被 FML 直接拒载。
forge_version_range=[36,)
# 1.16.5 世代 FML 语言加载器（javafml）大版本是 36
loader_version_range=[36,)

# ============================================================
#  模组元信息
# ============================================================
mod_id=logiscope
mod_name=LogiScope
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免各版本线的 jar 混装。
# 本分支 = 0.1.2-1.16.5-alpha：功能对齐 1.20.1 线的 0.1.2，alpha 表示实机尚未验收。
mod_version=0.1.3-1.16.5-alpha
mod_group_id=com.jessetech.logiscope
