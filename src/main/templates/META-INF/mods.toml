# 构建时，本文件中的占位符会被 gradle.properties 的值替换。
# 最终产物在 build/generated/sources/modMetadata/META-INF/mods.toml
# （1.20.1 世代文件名为 mods.toml；1.20.4+ 起改名为 neoforge.mods.toml。）

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="logiscope.png" #模组列表图标；文件在 jar 根（src/main/resources/logiscope.png）
description='''
纯客户端物流探测示波器。
在任意模组设备的容器 GUI 中按下快捷键，即可呼出示波器，
把某个容器格或NBT数值接到探头上，逐游戏刻记录其中物品的种类与数量变化。

A client-side logistics probing oscilloscope.
Press the hotkey inside any modded device's container GUI to bring up the oscilloscope, hook a container slot or an NBT value up to the probe,
and log how the item type and count inside it change tick by tick.
'''

# 纯客户端模组：依赖只在客户端校验。
# 服务端即使未安装本模组也不会报错（配合主类的 FMLEnvironment.dist 检查）。
# 1.20.1 为 Forge 血统：依赖字段用 mandatory=true（type="required" 为 20.2+ 写法）；
# 平台依赖 modId 在 1.20.1 世代仍为 "forge"。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
