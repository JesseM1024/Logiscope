# 构建时 ${} 占位符会被 gradle.properties 的值替换。
# 最终产物在 build/generated/sources/modMetadata/META-INF/neoforge.mods.toml

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="logiscope.png" #模组列表图标；文件在 jar 根（src/main/resources/logiscope.png）
description='''
纯客户端物流探测示波器。
在任意模组设备的容器 GUI 中按下快捷键，即可呼出示波器，
把某个容器格或NBT数值接到探头上，逐游戏刻记录其中物品的种类与数量变化。

A client-side logistics probing oscilloscope.
Press the hotkey inside any modded device's container GUI to bring up the oscilloscope, hook a container slot or an NBT value up to the probe,
and log how the item type and count inside it change tick by tick.
'''

# 纯客户端模组：依赖只在客户端校验。
# 服务端即使没装这个模组也不会报错（配合主类上的 @Mod(dist = Dist.CLIENT)）。
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
