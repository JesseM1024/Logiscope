plugins {
    id 'java-library'
    // 1.20.1 分支：MDG 主插件(net.neoforged.moddev)只支持 1.20.2+，
    // 1.20.1 用同一家官方的 legacy 插件（支持 Forge 1.17–1.20.1 与 NeoForge 1.20.1）。
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 对应 Java 17（master 1.21.1 主线是 21）
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // MDG legacy 插件已自动带上 Minecraft / Forge / NeoForge 仓库
}

legacyForge {
    // NeoForge 1.20.1 线：2.0.147 里要写进 enable { } 块（字节码核实：
    // LegacyForgeExtension 外层只有 version=Forge 线 / mcpVersion=原版线；
    // neoForgeVersion / forgeVersion / mcpVersion 三选一在 enable{} 的
    // LegacyForgeModdingSettings 上）。
    enable {
        neoForgeVersion = project.neo_version
    }

    // 本项目是【纯客户端】模组（@Mod(dist = Dist.CLIENT)），
    // 因此只声明 client 运行配置 —— 服务端/数据生成配置对本项目无意义，
    // 保留反而会让人误以为存在服务端行为。
    runs {
        client {
            client()
            // 需要调试渲染/网络时把下面打开
            // jvmArguments.addAll '-Dmixin.debug.export=true'
        }
        configureEach {
            // 各版本线独立 run 目录，切分支互不串味：
            // 本分支（1.20.1）用 1_20_1_neo/，master（1.21.1）仍用默认 run/。
            // saves / options.txt / mods / logs 互不覆盖。属性名已用 javap 核实
            // （RunModel.getGameDirectory()，DirectoryProperty）。
            gameDirectory = project.file('1_20_1_neo')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// legacy 线专用：1.20.1 生产环境是 SRG 映射，本地依赖的 mod jar 也需要
// 从 SRG 重映射到官方映射后才能参与编译/运行（本项目管理内无 mod 依赖，属预防性配置）。
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // 无第三方依赖。本项目刻意只用原版 + NeoForge 的渲染能力，
    // 不引入图表库，避免依赖地狱。
}

// ---------------------------------------------------------------------------
// 生成模组元数据
//
// ★ filteringCharset = 'UTF-8' 是必须的 ★
// ProcessResources 做占位符替换(expand)时默认用「平台默认编码」，
// 中文 Windows 上是 GBK，会把 UTF-8 模板里的中文转坏（字节被替换成 '?'），
// 产出非法 UTF-8 文件 → FML 解析 mods.toml 时抛
//   MalformedInputException: Input length = 2
// → 游戏报 "File ... is not a valid mod file"
// 这个坑在另一个项目里已经踩过一次，这里直接规避。
// （1.20.1 世代元数据文件名是 META-INF/mods.toml，neoforge.mods.toml 是 1.20.4+ 的名字。）
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 让运行任务的子进程输出直接接到 Gradle 控制台。
// 否则游戏崩溃时只会显示"退出码非零"，子进程的 stderr 会被吞掉。
tasks.matching { it.name in ['runClient'] }.configureEach {
    standardOutput = System.out
    errorOutput = System.err
}

idea {
    module {
        // 依赖源码包会多下载几十 MB。想省流量就注释掉这两行，
        // Minecraft 自己的源码由 MDG 提供，不受影响。
        downloadSources = true
        downloadJavadoc = true
    }
}
