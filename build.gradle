// ===========================================================================
//  LogiScope · MC 1.16.5 + Forge 36.2.x
//
//  为什么不是 MDG：ModDevGradle 的 legacy 插件官方支持范围是 Forge 1.17–1.20.1，
//  1.16.5 不在内。这一代只能用 ForgeGradle 5（配套 Gradle 7.6，见 wrapper 配置）。
// ===========================================================================
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java-library'
apply plugin: 'idea'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.16.5 是 Java 8 世代：这一行同时是"语法上限"，record / switch 箭头 /
// isBlank / 模式匹配 在编译期就会被拦下来（移植时必须降到 Java 8 子集）。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

minecraft {
    // 1.16.5 的官方推荐映射（MCP snapshot）。这一代还没有 Mojang official 映射。
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    // 纯客户端模组：只声明 client 运行配置。
    runs {
        client {
            workingDirectory project.file('1_16_5_forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                logiscope {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    // 只用于 @Nullable 注解（CLASS 保留，不进产物）。FG5 不像 MDG 会自动带进来。
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

// ---------------------------------------------------------------------------
// 生成模组元数据
//
// ★ filteringCharset = 'UTF-8' 是必须的 ★
// ProcessResources 做占位符替换时默认用平台编码，中文 Windows 是 GBK，
// 会把 UTF-8 模板里的中文转坏，产出非法 UTF-8 → FML 报
// "File ... is not a valid mod file"（MalformedInputException）。
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// 离线门禁的 classpath
//
// dev-check/offline-check.bat 需要「带映射名的 Minecraft+Forge 类路径」来编译
// TestChart / BenchRender。FG5 把这份 mapped jar 放在
// ~/.gradle/caches/forge_gradle/minecraft_user_repo/... 下，路径里带映射版本号，
// .bat 里硬编码会随 mappings 变动而失效 → 这里复制成固定的 build/merged/。
// ---------------------------------------------------------------------------
// 注意：minecraft 配置里不止一个文件（mapped jar / launcher jar / client-extra /
// accesstransformers / eventbus / coremods），只有 mapped 那个是 joined 的 MC+Forge
// 类路径；不筛一下会撞 duplicate entry。
var copyMinecraftDeps = tasks.register('copyMinecraftDeps', Copy) {
    // includeEmptyDirs = false：mcp_snapshot 的 zip 不是 jar，按扩展名筛掉
    from(configurations.minecraft) {
        include '**/*.jar'
    }
    into layout.buildDirectory.dir('mcdeps')
}

tasks.named('build') {
    dependsOn copyMinecraftDeps
}

// 让 runClient 的子进程输出直接接到 Gradle 控制台（否则崩溃只剩"退出码非零"）。
tasks.matching { it.name in ['runClient'] }.configureEach {
    standardOutput = System.out
    errorOutput = System.err
}

